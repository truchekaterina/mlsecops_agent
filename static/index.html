<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Страж — учебный агент</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --line: #2c3a48;
      --text: #e8eef4;
      --muted: #8aa0b5;
      --acc: #3d9cf0;
      --ok: #3ecf8e;
      --err: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 20px; }
    .stack {
      display: inline-block;
      background: #152033;
      color: var(--acc);
      border: 1px solid #234;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.75rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      font-size: 1rem;
    }
    button {
      margin-top: 16px;
      background: var(--acc);
      color: #041018;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    button:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .err { color: var(--err); min-height: 1.2em; margin-top: 8px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
    .tabs button { margin-top: 0; }
    .hidden { display: none !important; }
    #chat-log {
      min-height: 320px;
      max-height: 52vh;
      overflow-y: auto;
      padding: 8px 0 16px;
    }
    .msg { margin: 10px 0; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; }
    .msg.user { background: #243040; }
    .msg.agent { background: #15261d; border: 1px solid #1e4; }
    .msg.sys { color: var(--muted); font-size: 0.85rem; }
    .tools { color: var(--ok); font-size: 0.8rem; margin-top: 6px; }
    #composer { display: flex; gap: 8px; }
    #composer input { flex: 1; }
    #composer button { margin-top: 0; }
    .who { color: var(--muted); font-size: 0.9rem; }
    a { color: var(--acc); }
    #ask-box { margin-top: 10px; }
    #ask-box button { margin-top: 0; }
    button.ok { background: var(--ok); }
    .okmsg { color: var(--ok); min-height: 1.2em; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Страж</h1>
    <p class="sub">
      Учебный ИИ-управляющий сделками.
      <span class="stack">LangChain create_agent · LangGraph · MCP</span>
    </p>

    <section id="auth" class="card">
      <div class="tabs">
        <button type="button" id="tab-reg">Регистрация</button>
        <button type="button" id="tab-login" class="ghost">Вход</button>
      </div>
      <p class="who">Регистрация заводит ящик на ту же почту. Письма читаются в <a href="http://127.0.0.1:8090" target="_blank" rel="noopener">почтовом сервисе</a>, пароль у нового ящика тот же.</p>

      <form id="form-reg">
        <label>Имя</label>
        <input name="name" autocomplete="name" required />
        <label>Почта</label>
        <input name="email" type="email" autocomplete="email" required />
        <label>Пароль (от 8 знаков, заглавная, строчная и символ)</label>
        <input name="password" type="password" autocomplete="new-password" required minlength="8" />
        <button type="submit">Создать учётку и открыть чат</button>
      </form>

      <form id="form-login" class="hidden">
        <label>Email</label>
        <input name="login" autocomplete="username" required />
        <label>Пароль</label>
        <input name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Войти</button>
      </form>
      <div class="err" id="auth-err"></div>
      <div class="okmsg" id="auth-ok"></div>
    </section>

    <section id="chat" class="card hidden">
      <div class="row">
        <div>
          <div class="who" id="who"></div>
          <div class="who" id="bal"></div>
        </div>
        <a href="http://127.0.0.1:8090" target="_blank" rel="noopener">Почта</a>
        <button type="button" class="ghost" id="btn-out">Выйти</button>
      </div>
      <div id="chat-log"></div>
      <div id="ask-box" class="hidden">
        <div class="who" id="ask-text"></div>
        <div class="row">
          <button type="button" class="ok" id="btn-yes">Да, снять с резерва</button>
          <button type="button" class="ghost" id="btn-no">Нет, отмена</button>
        </div>
      </div>
      <form id="composer">
        <input id="q" placeholder="Например: Купи 1 акцию Сбербанка" autocomplete="off" />
        <button type="submit">Отправить</button>
      </form>
    </section>
  </div>
  <script>
    const authBox = document.getElementById("auth");
    const chatBox = document.getElementById("chat");
    const who = document.getElementById("who");
    const bal = document.getElementById("bal");
    const log = document.getElementById("chat-log");
    const err = document.getElementById("auth-err");
    const ok = document.getElementById("auth-ok");
    const HINT = "Можно: список акций, состояние счёта, какие куплены, курс валют ЦБ, купить/продать.";
    let chatBusy = false;
    function setChatBusy(on) {
      chatBusy = on;
      document.getElementById("q").disabled = on;
      document.querySelector("#composer button").disabled = on;
      document.getElementById("btn-yes").disabled = on;
      document.getElementById("btn-no").disabled = on;
    }
    function resetChat() {
      log.innerHTML = "";
      addMsg("sys", HINT);
    }
    function fmtErr(data, fallback) {
      const d = data && data.detail;
      if (typeof d === "string") return d;
      if (Array.isArray(d)) return d.map((x) => x.msg || JSON.stringify(x)).join("; ");
      return fallback;
    }

    function fmtAcc(acc) {
      if (!acc) return "";
      const pos = (acc.positions || []).map((p) => p.ticker + " " + p.shares + " шт.").join(", ") || "бумаг нет";
      return "Основной: " + acc.cash_usd + " ₽ · Резерв: " + acc.reserve_usd + " ₽ · " + pos;
    }
    function showChat(user) {
      resetChat();
      authBox.classList.add("hidden");
      chatBox.classList.remove("hidden");
      who.textContent = "Вы вошли: " + user.name + " <" + user.email + ">. Уведомления — в почтовом сервисе.";
      bal.textContent = fmtAcc(user.account);
      refreshAcc();
      showAsk(user.account && user.account.pending_reserve);
    }
    function api(url, options) {
      const opts = options ? { ...options } : {};
      opts.credentials = "same-origin";
      return fetch(url, opts);
    }
    async function refreshAcc() {
      const r = await api("/api/account");
      if (r.status === 401) { showAuth(); return; }
      if (!r.ok) return;
      bal.textContent = fmtAcc(await r.json());
    }
    function showAuth() {
      resetChat();
      chatBox.classList.add("hidden");
      authBox.classList.remove("hidden");
    }
    function addMsg(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    function showAuthTab(name) {
      document.getElementById("form-reg").classList.toggle("hidden", name !== "reg");
      document.getElementById("form-login").classList.toggle("hidden", name !== "login");
      document.getElementById("tab-reg").classList.toggle("ghost", name !== "reg");
      document.getElementById("tab-login").classList.toggle("ghost", name !== "login");
      err.textContent = "";
      ok.textContent = "";
    }
    document.getElementById("tab-reg").onclick = () => showAuthTab("reg");
    document.getElementById("tab-login").onclick = () => showAuthTab("login");

    document.getElementById("form-reg").onsubmit = async (e) => {
      e.preventDefault();
      err.textContent = "";
      ok.textContent = "";
      const fd = new FormData(e.target);
      const r = await api("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: fd.get("name"),
          email: fd.get("email"),
          password: fd.get("password"),
        }),
      });
      const data = await r.json();
      if (!r.ok) { err.textContent = fmtErr(data, "Ошибка регистрации"); return; }
      showChat(data);
      showAsk(data.account && data.account.pending_reserve);
    };

    document.getElementById("form-login").onsubmit = async (e) => {
      e.preventDefault();
      err.textContent = "";
      const fd = new FormData(e.target);
      const r = await api("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          login: fd.get("login"),
          password: fd.get("password"),
        }),
      });
      const data = await r.json();
      if (!r.ok) { err.textContent = fmtErr(data, "Ошибка входа"); return; }
      showChat(data);
      showAsk(data.account && data.account.pending_reserve);
    };

    document.getElementById("btn-out").onclick = async () => {
      await api("/api/logout", { method: "POST" });
      localStorage.removeItem("strazh_token");
      showAuth();
    };

    document.getElementById("composer").onsubmit = async (e) => {
      e.preventDefault();
      if (chatBusy) return;
      const inp = document.getElementById("q");
      const text = inp.value.trim();
      if (!text) return;
      inp.value = "";
      sendChat(text);
    };

    const askBox = document.getElementById("ask-box");
    const askText = document.getElementById("ask-text");
    let askId = "";
    function showAsk(p) {
      if (!p || !p.id) { askBox.classList.add("hidden"); askId = ""; return; }
      askId = p.id;
      askText.textContent = p.prompt || "Подтвердите заявку кнопкой.";
      document.getElementById("btn-yes").textContent = "Да, подтвердить";
      askBox.classList.remove("hidden");
    }
    async function sendTicket(path) {
      if (!askId || chatBusy) return;
      setChatBusy(true);
      try {
        const r = await api(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: askId }),
        });
        const data = await r.json();
        if (!r.ok) {
          addMsg("sys", (data && data.detail) || "Заявка не выполнена");
          const fresh = await api("/api/account");
          if (fresh.ok) {
            const acc = await fresh.json();
            bal.textContent = fmtAcc(acc);
            showAsk(acc.pending_reserve);
          }
          return;
        }
        addMsg("agent", data.text || "");
        if (data.account) bal.textContent = fmtAcc(data.account);
        showAsk(data.needs_reserve_confirm);
      } finally {
        setChatBusy(false);
      }
    }
    async function sendChat(text) {
      if (chatBusy) return;
      setChatBusy(true);
      addMsg("user", text);
      addMsg("sys", "Запрос выполняется, чат заблокирован...");
      const pending = log.lastChild;
      try {
        const r = await api("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        pending.remove();
        const data = await r.json();
        if (!r.ok) {
          addMsg("sys", data.detail || "Нужно войти заново");
          if (r.status === 401) showAuth();
          return;
        }
        addMsg("agent", data.text);
        if (data.account) bal.textContent = fmtAcc(data.account);
        showAsk(data.needs_reserve_confirm);
      } finally {
        setChatBusy(false);
      }
    }
    document.getElementById("btn-yes").onclick = () => sendTicket("/api/reserve/confirm");
    document.getElementById("btn-no").onclick = () => sendTicket("/api/reserve/deny");

    localStorage.removeItem("strazh_token");
    (async () => {
      const r = await api("/api/me");
      if (!r.ok) return;
      showChat(await r.json());
    })();
  </script>
</body>
</html>
