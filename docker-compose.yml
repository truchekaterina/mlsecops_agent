name: strazh

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Учебный стенд на CPU, как в коде Стража.
      OLLAMA_NUM_GPU: "0"
      CUDA_VISIBLE_DEVICES: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 15s
      retries: 20
      start_period: 15s

  # Скачивает qwen2.5:3b в том ollama, пока Страж ещё не стартовал.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${STRAZH_MODEL:-qwen2.5:3b}"]
    restart: "no"

  strazh:
    image: ${STRAZH_IMAGE:-strazh:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Нестандартные порты на всех интерфейсах хоста — показ в одной Wi‑Fi сети.
      # Внутри контейнера процессы по-прежнему на 8080 и 8090.
      - "38480:8080"
      - "38490:8090"
    environment:
      STRAZH_OLLAMA_URL: http://ollama:11434
      STRAZH_MODEL: ${STRAZH_MODEL:-qwen2.5:3b}
      # Связь веб→почта внутри контейнера, не адрес для браузера одногруппников.
      STRAZH_MAIL_URL: https://127.0.0.1:8090
      STRAZH_TLS_IPS: ${STRAZH_TLS_IPS:-}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    extra_hosts:
      # Свой MCP на машине с Docker: http://host.docker.internal:ПОРТ/mcp
      - "host.docker.internal:host-gateway"
    volumes:
      - strazh-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; c=ssl.create_default_context(cafile='/app/data/tls/cert.pem'); urllib.request.urlopen('https://127.0.0.1:8080/api/health', context=c, timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 45s

volumes:
  ollama:
  strazh-data:
